[package]
name = "cute-pet"
version = "0.3.4"
edition = "2021"

[features]
# ⚠️ 默认 = 商业构建: 二进制**不含任何第三方版权角色素材**。
#
# 「丛雨（むらさめ）」素材（立绘分层图 / 逐字台词 / 语音）版权归柚子社《千恋＊万花》，
# 不归我方。软件本体（屏幕操控 / 对话 / 渲染引擎）为原创、与角色素材解耦，可正常商用。
#
# 为什么默认关闭(合规优先): 这样**任何**构建命令天然合规 —— 包括那些无法透传
# cargo 参数的工具链(Android 的 `plyx apk` 只认 --native/--install/--auto)。
# 不会因为某个平台漏加 `--no-default-features` 就把版权素材带进商业包。
#
# 测试 / 开发想带角色跑:  cargo run --features bundle-murasame
# 商业版用户自行提供素材: 放到可执行文件同级的 assets/ 目录(运行时加载,
#                        缺失时提示「请放置素材」)。
# 详见 THIRD-PARTY-NOTICES.md §2.2。
default = []
bundle-murasame = []

[dependencies]
anyhow = "1.0.104"
# lazy-ply 已改名 Lazy-UI(GitHub: lilyco-42/Lazy-UI), 用 git 依赖(canonical, CI 直接 clone)
lazy-ply = { git = "https://github.com/lilyco-42/Lazy-UI.git", branch = "main" }
ply-engine = { version = "1.1", default-features = false, features = ["built-in-shaders", "audio"] }
# include-exclude: 让 CoreAsset 排除角色素材、CharAsset 只含角色素材(需显式启用)
rust-embed = { version = "8.12.0", features = ["include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3.4.0", features = ["json"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

# 本地 vendored miniquad-ply(为 HarmonyOS/ohos 添加 native backend 支持,
# 仿 android; 原 registry 版无 ohos 后端)。其它平台行为不变。
[patch.crates-io]
miniquad-ply = { path = "vendor/miniquad-ply" }
# macroquad-ply: 修复字符输入队列 LIFO 逆序 bug(多字符输入被反转, issue#1)
macroquad-ply = { path = "vendor/macroquad-ply" }
# quad-snd(宏 quad 音频)在 ohos 下走 noop 桩(鸿蒙音频后续用 OH_AudioRenderer 单独接)
quad-snd = { path = "vendor/quad-snd" }

# Android APK 构建配置(cargo-quad-apk / plyx apk --native)
# assets 指向空目录: 本应用全部资产经 rust-embed 编译进 .so, APK 无需打包 assets
# (pet/assets 内含中文文件名, aapt2 在 Windows 上无法处理)
[package.metadata.android]
assets = "assets_apk/"
# 发布版只打 arm64(真机, 见 pet/release/); 开发/模拟器测试用双 ABI
# 发布构建: 注释掉 x86_64, plyx apk --native, 复制到 release/
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
# 网络权限(远程 TTS/LLM 必需; cargo-quad-apk 键名是 permission, 单数)
permission = [
  { name = "android.permission.INTERNET" },
  { name = "android.permission.SYSTEM_ALERT_WINDOW" },
  { name = "android.permission.FOREGROUND_SERVICE" },
  { name = "android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" },
  { name = "android.permission.POST_NOTIFICATIONS" },
]
# TYPE_APPLICATION_OVERLAY 需 API 26+ (悬浮窗桌宠最低版本)
min_sdk_version = 26
# 显式 compile/target SDK(本地 fork 默认 31; 本机只有 android-35/36)
android_version = 36
target_sdk_version = 36
# 允许 http 明文(本地/局域网 TTS 服务, 如模拟器 10.0.2.2)
application_attributes = { "android:usesCleartextTraffic" = "true", "android:debuggable" = "true" }

# W2 视觉: MediaProjection 截屏前台服务(cargo-quad-apk-ply 原生支持)
[[package.metadata.android.service]]
name = "rust.cute_pet.ScreenCaptureService"
foreground_service_type = "mediaProjection"
exported = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# WASM 专用: 不启用 LTO(会破坏 miniquad JS 桥接符号)。
# opt-level 用 3 而非 "s": "s" 为省体积牺牲了运行性能, 桌宠每帧重绘立绘+UI,
# 是 CPU 密集型, 体积多几百 KB 换明显更顺的帧率, 划算。
[profile.release-wasm]
inherits = "release"
lto = false
codegen-units = 1
opt-level = 3
