# WASM: 允许未定义的导入符号(miniquad JS 桥接)。
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=--import-undefined"]

# ── HarmonyOS(aarch64-unknown-linux-ohos) ──
# 这段交叉链接配置依赖本机 SDK 路径, 刻意**不**写在这个文件里。
#
# 以前这里硬编码着 D:/ohos-sdk/command-line-tools/... —— 任何人 clone 下来做
# 鸿蒙交叉编译都会直接 linker 失败, 而报错信息完全指向不到这个文件, 排查成本很高。
#
# 生成本地配置(写入 ~/.cargo/config.toml, 不进仓库):
#   OHOS_SDK_NATIVE=<sdk>/default/openharmony/native ./tools/setup-ohos-cargo-config.sh
# 见 ../../docs/harmonyos-rust.md(仓库根 docs/ 下另有 CI_BUILD.md)。
#
# CI 不走这条路: harmony job 用 RUSTFLAGS 覆盖(见 .github/workflows/build-all.yml)。
# 另外编译器仍需环境变量:
#   CC_aarch64_unknown_linux_ohos / AR_aarch64_unknown_linux_ohos /
#   CFLAGS_aarch64_unknown_linux_ohos
