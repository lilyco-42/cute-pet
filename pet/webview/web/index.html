<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>cute-pet · 悬浮窗壳</title>
  <link rel="icon" href="data:,">
  <style>
    /* 与 pages/index.html 唯一的实质差别: 背景透明。
       Rust 侧 clear_background(0,0,0,0) 已经是透明清屏(run.rs:873),
       所以只要页面/画布自身不铺底色, 悬浮窗里看到的就是下层应用。 */
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #e8e8ee;
    }
    #glcanvas {
      position: fixed; inset: 0; width: 100%; height: 100%;
      display: block; outline: none; background: transparent;
    }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 13px; opacity: .85; text-shadow: 0 1px 2px rgba(0,0,0,.55);
      transition: opacity .4s ease; pointer-events: none;
    }
    #err {
      position: fixed; left: 8px; right: 8px; bottom: 8px;
      font-size: 11px; color: #ffb4b4; display: none; white-space: pre-wrap;
      background: rgba(0,0,0,.45); padding: 6px 8px; border-radius: 6px;
    }

    /* ---- agent 脸：桌宠说台词 + 弹审批卡(MVP) ----
       窗口默认很小(160x280), 卡片出现时由原生侧 setSize 放大; 这里只管样式。 */
    .agent-ui {
      position: fixed; left: 6px; right: 6px; z-index: 10;
      font-size: 12px; line-height: 1.45; color: #1c1c22;
      pointer-events: none;
    }
    #agent-bubble {
      top: 6px; display: none;
      background: rgba(255,255,255,.92); padding: 7px 10px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.28); max-width: 92%;
    }
    #agent-card {
      bottom: 6px; display: none; pointer-events: auto;
      background: rgba(20,20,28,.92); color: #e8e8ee; padding: 10px;
      border-radius: 12px; box-shadow: 0 3px 12px rgba(0,0,0,.4);
      border: 1px solid rgba(255,255,255,.12);
    }
    #agent-card .ac-title { font-weight: 600; margin-bottom: 6px; }
    #agent-card .ac-act {
      font-size: 11px; opacity: .8; margin: 2px 0 8px; padding-left: 8px;
      border-left: 2px solid rgba(255,255,255,.3);
    }
    #agent-card .ac-btns { display: flex; gap: 8px; }
    #agent-card button {
      flex: 1; border: 0; border-radius: 8px; padding: 7px 0; font-size: 12px;
      cursor: pointer; color: #fff;
    }
    #agent-card .ac-ok { background: #4a8c5b; }
    #agent-card .ac-no { background: #8c4a4a; }
  </style>
</head>
<body>
  <canvas id="glcanvas" tabindex="1"></canvas>
  <div id="loading">加载中…</div>
  <div id="err"></div>
  <div id="agent-bubble" class="agent-ui"></div>
  <div id="agent-card" class="agent-ui">
    <div class="ac-title"></div>
    <div class="ac-act"></div>
    <div class="ac-btns">
      <button class="ac-ok">批准</button>
      <button class="ac-no">拒绝</button>
    </div>
  </div>

  <!-- 顺序要求: canvas 必须在 ply_bundle.js 之前(它加载时就 querySelector("#glcanvas"));
       pet_bridge.js 更早, 让原生桥在内核起来前可用。 -->
  <script src="pet_bridge.js"></script>
  <!-- 壳内 web TTS(pet_tts_local.js / vendor/kokoro-zh)已于 2026-09-23 下线:
       音素集不匹配导致「前半句糊 + 英文口音」, 且需联网拉模型。
       壳内离线语音改由原生 sherpa-onnx 独家承担(见 docs §13.1.2 / §14)。 -->
  <script src="ply_bundle.js"></script>
  <script>
    (async () => {
      const ld = document.getElementById("loading");
      const errBox = document.getElementById("err");
      const fail = (e) => {
        console.error(e);
        // 真机壳里 app.wasm 随 APK 走, 不会缺; 浏览器(file://)演示缺 wasm 是预期,
        // 不弹报错框(默认桌宠 mock agent 仍照常跑)。
        if (errBox && window.PetShell && window.PetShell.isNative()) {
          errBox.style.display = "block";
          errBox.textContent = "加载失败：" + ((e && e.message) || e);
        }
        if (ld) ld.style.opacity = 0;
      };
      window.addEventListener("error", (ev) => fail(ev.error || ev.message));

      try {
        // 壳环境: 资源来自 APK assets(file://)。WebView 必须开
        // setAllowFileAccessFromFileURLs / setAllowUniversalAccessFromFileURLs,
        // 否则 fetch("app.wasm") 会被同源策略挡掉。
        //
        // ⚠️ 不能照搬 pages/index.html 的 `if (!r.ok) throw`: file:// 下
        // response.status 恒为 0、r.ok 恒为 false(加载成功也是如此!)。
        // 所以: http(s)(status!==0)查状态码; file:// 只能靠下面的 magic word 兜底。
        const r = await fetch("app.wasm");
        if (r.status !== 0 && !r.ok) {
          throw new Error("取 app.wasm 失败: HTTP " + r.status + " " + r.statusText);
        }
        // fetch 对 4xx 不会 reject, 错误页正文会被当二进制交上来, compile 只会报
        // "expected magic word ... found 46 6f 72 62"(="Forb")这种天书; 而 file://
        // 下又没有可靠状态码 —— magic word 校验是两条路共用的最后防线。
        const buf = new Uint8Array(await r.arrayBuffer());
        if (!(buf.length >= 4 && buf[0] === 0x00 && buf[1] === 0x61 &&
              buf[2] === 0x73 && buf[3] === 0x6d)) {
          const hex = Array.prototype.map.call(buf.slice(0, 4),
            b => b.toString(16).padStart(2, "0")).join(" ");
          throw new Error("app.wasm 内容不是 WebAssembly（前 4 字节 " + hex +
            ", 应为 00 61 73 6d）" + (r.status !== 0 ? ", HTTP " + r.status : "") +
            "；若持续出现, 说明 APK 内的 app.wasm 缺失或已损坏");
        }
        const obj = await WebAssembly.compile(buf);

        // 顺序不能反: 插件先挂 importObject.env, 再补缺失桩(见 pages/index.html 注释)
        register_plugins(plugins);
        add_missing_functions_stabs(obj);

        const inst = await WebAssembly.instantiate(obj, importObject);
        wasm_memory = inst.exports.memory;
        wasm_exports = inst.exports;
        init_plugins(plugins);

        if (ld) ld.style.opacity = 0;
        if (window.PetShell) window.PetShell.ready();
        // 粘性行为: 回注此前网络导入的素材, 再启动引擎(load_asset 会优先返回运行时资产)
        if (window.cutePetInjectStoredAssets) {
          try { await window.cutePetInjectStoredAssets(); } catch (e) {}
        }
        inst.exports.main();
      } catch (e) {
        fail(e);
      }
    })();
  </script>

  <!-- 最小 MVP 的内置 mock agent(默认桌宠当"脸"的演示大脑)。
       浏览器(无原生桥)下自动启动; 真机壳里由 OverlayService.onPageFinished
       用 evalJs 启动同一个 mock。后续接 lilyco-approve 真大脑时替换此处。 -->
  <script>
    window.__mockAgent = {
      start: function () {
        var S = window.PetShell;
        if (!S || !S.agentSay) {
          return;
        }
        S.agentSay("喵～我是你的桌宠小伙伴，你的桌面小管家。检测到一条微信消息，要我帮你点开吗？");
        setTimeout(function () {
          S.agentPropose([
            { type: "open_app", pkg: "com.tencent.mm", label: "微信" },
            { type: "tap_text", text: "文件传输助手" },
            { type: "tap", x: 540, y: 1180 }
          ]);
        }, 1300);
      }
    };
    // 浏览器演示: 没有原生桥就本地跑 mock(真机由原生触发, 避免重复)
    if (window.PetShell && !window.PetShell.isNative()) {
      window.__mockAgent.start();
    }
  </script>
</body>
</html>
