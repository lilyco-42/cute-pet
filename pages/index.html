<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>cute-pet · 丛雨 桌宠 · 浏览器试玩</title>
  <link rel="icon" href="data:,">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0e0e12; overflow: hidden;
      font-family: system-ui, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #e8e8ee;
    }
    #glcanvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; outline: none; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 15px; opacity: .85; transition: opacity .4s ease;
    }
    #hint {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
      font-size: 12px; opacity: .5; pointer-events: none; text-align: center; width: 90%;
    }
  </style>
</head>
<body>
  <canvas id="glcanvas" tabindex="1"></canvas>
  <div id="loading">正在加载 WebAssembly 试玩版…</div>
  <div id="hint">鼠标拖拽 / 点击与桌宠互动 · 这是 cute-pet 的浏览器试玩，资产与二进制同源托管于本仓库</div>

  <!-- ply-engine 官方 web 引导包(pages/ply_bundle.js, 由 pages.yml 拷进 site/)。
       它 = miniquad gl.js + macroquad_audio + sapp_jsutils + ply_net(HTTP/WebSocket)
       + ply_storage(OPFS) + ply_fixes + ply_accessibility, 一次性把 Rust 侧
       需要的所有 wasm 导入都实现掉。

       ⚠️ 别换回裸 gl.js: pet/.cargo/config.toml 用 --import-undefined 刻意保留
       未定义导入, 缺实现时会落进 gl.js 的"缺失函数桩", 而那个桩**每次被调用都
       console.warn**。audio_*/ply_a11y_* 每帧都调 → 实测 ~4400 条/秒, 直接把
       DevTools 和主线程拖垮(这就是"大量错误 + 性能损耗"的根因)。

       bundle 在加载时就会 querySelector("#glcanvas"), 所以 canvas 必须在它之前。 -->
  <script src="ply_bundle.js"></script>
  <script>
    (async () => {
      const ld = document.getElementById("loading");
      try {
        // 用 arrayBuffer 分支实例化, 避免 GitHub Pages 对 .wasm 的 Content-Type
        // 影响 compileStreaming(对 application/octet-stream 会直接抛错)。
        const bytes = await fetch("app.wasm").then(r => r.arrayBuffer());
        const obj = await WebAssembly.compile(bytes);

        // 顺序不能反: 插件先把自己的函数(register_plugin)挂进 importObject.env,
        // 之后 add_missing_functions_stabs 才跑得上——此时已无任何缺失导入,
        // 那两条 "No ... function" / "Missed function" 警告也就不会再出现。
        register_plugins(plugins);
        add_missing_functions_stabs(obj);

        const inst = await WebAssembly.instantiate(obj, importObject);
        wasm_memory = inst.exports.memory;
        wasm_exports = inst.exports;
        init_plugins(plugins);

        if (ld) ld.style.opacity = 0;
        inst.exports.main();
      } catch (e) {
        console.error(e);
        if (ld) ld.textContent = "加载失败：" + e;
      }
    })();
  </script>
</body>
</html>
