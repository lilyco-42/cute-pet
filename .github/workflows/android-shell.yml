name: Android WebView Shell

# wasm + WebView 跨平台路线的 M1: 用 Android SDK 自带工具链(aapt2 + javac + d8 +
# zipalign + apksigner)构建**纯 framework** 的 WebView 悬浮窗壳。
# 不依赖 Gradle / androidx / 任何第三方库, 因此无需联网拉依赖。
#
# 产物: cute-pet-shell.apk(CI 产物; push main 时在合规闸门后自动挂载到 GitHub Release)。
# 合规: 默认构建 = 商业版(不含第三方版权角色素材), 闸门见下。
#
# 全量渠道(2026-09-24): workflow_dispatch + with_character_assets=true 时构建**含素材**
# 的自测 APK(语音从非商用 prerelease 的 voice-assets.zip 取, 签名经 GitHub Secret 固化),
# 构建后自动挂回 v0.3.5-full-demo prerelease(--clobber)。该渠道已标注非商用/禁止再分发;
# 商业线(push main → vX.Y.Z, 无素材)与它完全隔离。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      with_character_assets:
        description: '自测模式: wasm 带角色素材(仅供个人真机调试, 不得发布)'
        required: false
        default: false
        type: boolean

concurrency:
  group: android-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build WebView shell APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rust + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pet

      - name: 全量模式——下载语音素材包(先于 wasm 构建, rust-embed 编译期嵌入)
        # voice/*.ogg + greeting/ 被 .gitignore 刻意挡在仓库外(版权纪律: 仓库/CI
        # 天然无语音)。CI 全量构建从非商用 prerelease 渠道取素材包 —— 与 APK 本体
        # 同一渠道、同一版权暴露面(该 Release 已标注非商用/禁止再分发)。
        # ⚠️ 顺序关键: 必须在 cargo build 之前就位, 否则 wasm 里没有语音。
        if: inputs.with_character_assets == true
        run: |
          set -e
          URL="https://github.com/${{ github.repository }}/releases/download/v0.3.5-full-demo/voice-assets.zip"
          curl -fsSL "$URL" -o /tmp/voice-assets.zip
          unzip -qo /tmp/voice-assets.zip -d pet/assets/   # -o: git 里有同名 .srt(gitignore 只挡 ogg), 交互询问会杀死 CI
          echo "语音素材: $(find pet/assets/voice -type f | wc -l) 个文件"
          [ -f pet/assets/voice/mur001_002.ogg ] || { echo "::error::语音包内容异常"; exit 1; }

      - name: 全量模式——解码固定签名 keystore(GitHub Secret, 不入 git)
        # 与本机/历史构建同签名 ⇒ 用户覆盖安装无需卸载重装。
        # keystore 本体守 ".gitignore: 含密钥绝不能入库" 纪律, 经 Secret 传递。
        if: inputs.with_character_assets == true
        env:
          SHELL_KEYSTORE_B64: ${{ secrets.SHELL_KEYSTORE_B64 }}
        run: |
          set -e
          [ -n "$SHELL_KEYSTORE_B64" ] || { echo "::error::secret SHELL_KEYSTORE_B64 未设置"; exit 1; }
          echo "$SHELL_KEYSTORE_B64" | base64 -d > /tmp/shell-debug.keystore
          echo "CUTE_PET_KEYSTORE=/tmp/shell-debug.keystore" >> "$GITHUB_ENV"

      - name: Build wasm kernel
        working-directory: pet
        run: |
          if [ "${{ inputs.with_character_assets }}" = "true" ]; then
            echo "::warning::自测模式: wasm 含第三方角色素材, 产物不得发布"
            cargo build --target wasm32-unknown-unknown --profile release-wasm --features bundle-murasame
          else
            cargo build --target wasm32-unknown-unknown --profile release-wasm
          fi
          ls -la target/wasm32-unknown-unknown/release-wasm/cute-pet.wasm

      - name: Ensure Android SDK build-tools
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if ! ls "$SDK"/build-tools/* >/dev/null 2>&1; then
            CM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            [ -x "$CM" ] || { echo "::error::找不到 sdkmanager: $CM"; exit 1; }
            yes | "$CM" --licenses >/dev/null 2>&1 || true
            "$CM" --install "platforms;android-34" "build-tools;34.0.0"
          fi
          ls -d "$SDK"/build-tools/* "$SDK"/platforms/*

      - name: 纯 Java 单测(不依赖 Android 的逻辑单元)
        # 壳不用 Gradle; android.jar 在 JVM 上全是 Stub! ⇒ 只能测"不 import android.*"的
        # 纯逻辑单元(如 TtsSidFile)。零依赖 javac + 手写断言, 见 tools/README 与脚本注释。
        run: bash pet/webview/android/tools/run_pure_java_tests.sh

      - name: Build APK
        run: bash pet/webview/android/build.sh --out dist-shell

      - name: 全量模式——产物定名
        if: inputs.with_character_assets == true
        run: cp dist-shell/cute-pet-shell.apk dist-shell/cute-pet-full-demo.apk

      - name: 体积与内容层(验证清单第 7 项需要数据)
        run: |
          echo "APK: $(du -h dist-shell/cute-pet-shell.apk | cut -f1)"
          echo "内容层:"
          du -h dist-shell/assets/pet/* | sort -h
          echo "APK 内文件树:"
          unzip -Z1 dist-shell/cute-pet-shell.apk | sed 's/^/  /'

      - name: 产物校验(结构 / 依赖 / 模型 / 体积 / 合规)
        # 断言全部固化在 verify_apk.sh 里, 本地与 CI 同一套(此前是 inline grep,
        # 容易和本地手工核验漂移)。脚本本身也做反向验证: 抠掉模型文件必须 exit 1。
        run: |
          if [ "${{ inputs.with_character_assets }}" = "true" ]; then
            bash pet/webview/android/verify_apk.sh dist-shell/cute-pet-shell.apk --selftest
          else
            bash pet/webview/android/verify_apk.sh dist-shell/cute-pet-shell.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.with_character_assets == true && 'cute-pet-full-demo-apk' || 'cute-pet-shell-apk' }}
          path: ${{ inputs.with_character_assets == true && 'dist-shell/cute-pet-full-demo.apk' || 'dist-shell/cute-pet-shell.apk' }}
          if-no-files-found: error

  # ====== 全量(自测)发布: workflow_dispatch + with_character_assets 时,
  # ====== 把 CI 构建的全量 APK 挂到非商用 prerelease(v0.3.5-full-demo, --clobber)。
  # ====== 该渠道已标注版权归属/非商业/禁止再分发 —— 详见该 Release 说明。
  # ====== 商业线(push main → vX.Y.Z Release, 无素材)完全不受此影响。
  release-full-demo:
    name: Attach full demo APK to non-commercial prerelease
    needs: build-apk
    if: github.event_name == 'workflow_dispatch' && inputs.with_character_assets == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cute-pet-full-demo-apk
          path: .

      - name: 产物校验(上 Release 前复查, --selftest 跳过素材闸门)
        run: bash pet/webview/android/verify_apk.sh cute-pet-full-demo.apk --selftest

      - name: 挂载到 v0.3.5-full-demo(覆盖旧包)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release view v0.3.5-full-demo >/dev/null 2>&1 || {
            echo "::error::prerelease v0.3.5-full-demo 不存在(需先手动创建, 内含版权标注与 voice-assets.zip)"
            exit 1
          }
          gh release upload v0.3.5-full-demo cute-pet-full-demo.apk --clobber
          echo "✅ 全量 APK(CI 构建, 固定签名)已更新到 v0.3.5-full-demo"

  # ============ 发布: push main 时把壳 APK 挂到 GitHub Release ============
  # tag 与 Build All workflow 同源(读 pet/Cargo.toml 的 version): 那边全部平台
  # 构建通过后 `gh release create v$VER`; 本 job 等它出现再 `gh release upload`。
  # 自测模式(with_character_assets)只存在于 workflow_dispatch, 永远到不了这里。
  release-apk:
    name: Attach shell APK to GitHub Release
    needs: build-apk
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cute-pet-shell-apk
          path: .

      - name: 产物校验(上 Release 前复查, 与 build-apk 同级防线)
        # 复查的是**即将上传的那个 artifact**(而不是构建目录), 与 build-apk 用同一脚本。
        run: bash pet/webview/android/verify_apk.sh cute-pet-shell.apk

      - name: 等待 Build All 创建 Release 后挂载 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION=$(grep -m1 '^version' pet/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          TAG="v${VERSION}"
          echo "目标 Release: $TAG"
          found=""
          # Build All 的 release job 要等全部平台构建通过才打 tag, 常规需 20-40 分钟;
          # 轮询上限 60 分钟, 超时即失败(静默跳过会变成"忘了挂 APK"类事故)。
          for i in $(seq 1 120); do
            if gh release view "$TAG" >/dev/null 2>&1; then found=1; break; fi
            echo "[$i/120] Release $TAG 尚未创建, 30s 后重试..."
            sleep 30
          done
          if [ -z "$found" ]; then
            echo "::error::60 分钟内未出现 Release $TAG —— Build All 未打 tag(构建失败或版本号已发布), APK 无法挂载"
            exit 1
          fi
          gh release upload "$TAG" cute-pet-shell.apk --clobber
          echo "✅ cute-pet-shell.apk 已挂载到 $TAG"
