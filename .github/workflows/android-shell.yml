name: Android WebView Shell

# wasm + WebView 跨平台路线的 M1: 用 Android SDK 自带工具链(aapt2 + javac + d8 +
# zipalign + apksigner)构建**纯 framework** 的 WebView 悬浮窗壳。
# 不依赖 Gradle / androidx / 任何第三方库, 因此无需联网拉依赖。
#
# 产物: cute-pet-shell.apk(CI 产物; push main 时在合规闸门后自动挂载到 GitHub Release)。
# 合规: 默认构建 = 商业版(不含第三方版权角色素材), 闸门见下。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      with_character_assets:
        description: '自测模式: wasm 带角色素材(仅供个人真机调试, 不得发布)'
        required: false
        default: false
        type: boolean

concurrency:
  group: android-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build WebView shell APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rust + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pet

      - name: Build wasm kernel
        working-directory: pet
        run: |
          if [ "${{ inputs.with_character_assets }}" = "true" ]; then
            echo "::warning::自测模式: wasm 含第三方角色素材, 产物不得发布"
            cargo build --target wasm32-unknown-unknown --profile release-wasm --features bundle-murasame
          else
            cargo build --target wasm32-unknown-unknown --profile release-wasm
          fi
          ls -la target/wasm32-unknown-unknown/release-wasm/cute-pet.wasm

      - name: Ensure Android SDK build-tools
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if ! ls "$SDK"/build-tools/* >/dev/null 2>&1; then
            CM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            [ -x "$CM" ] || { echo "::error::找不到 sdkmanager: $CM"; exit 1; }
            yes | "$CM" --licenses >/dev/null 2>&1 || true
            "$CM" --install "platforms;android-34" "build-tools;34.0.0"
          fi
          ls -d "$SDK"/build-tools/* "$SDK"/platforms/*

      - name: 纯 Java 单测(不依赖 Android 的逻辑单元)
        # 壳不用 Gradle; android.jar 在 JVM 上全是 Stub! ⇒ 只能测"不 import android.*"的
        # 纯逻辑单元(如 TtsSidFile)。零依赖 javac + 手写断言, 见 tools/README 与脚本注释。
        run: bash pet/webview/android/tools/run_pure_java_tests.sh

      - name: Build APK
        run: bash pet/webview/android/build.sh --out dist-shell

      - name: 体积与内容层(验证清单第 7 项需要数据)
        run: |
          echo "APK: $(du -h dist-shell/cute-pet-shell.apk | cut -f1)"
          echo "内容层:"
          du -h dist-shell/assets/pet/* | sort -h
          echo "APK 内文件树:"
          unzip -Z1 dist-shell/cute-pet-shell.apk | sed 's/^/  /'

      - name: 产物校验(结构 / 依赖 / 模型 / 体积 / 合规)
        # 断言全部固化在 verify_apk.sh 里, 本地与 CI 同一套(此前是 inline grep,
        # 容易和本地手工核验漂移)。脚本本身也做反向验证: 抠掉模型文件必须 exit 1。
        run: |
          if [ "${{ inputs.with_character_assets }}" = "true" ]; then
            bash pet/webview/android/verify_apk.sh dist-shell/cute-pet-shell.apk --selftest
          else
            bash pet/webview/android/verify_apk.sh dist-shell/cute-pet-shell.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cute-pet-shell-apk
          path: dist-shell/cute-pet-shell.apk
          if-no-files-found: error

  # ============ 发布: push main 时把壳 APK 挂到 GitHub Release ============
  # tag 与 Build All workflow 同源(读 pet/Cargo.toml 的 version): 那边全部平台
  # 构建通过后 `gh release create v$VER`; 本 job 等它出现再 `gh release upload`。
  # 自测模式(with_character_assets)只存在于 workflow_dispatch, 永远到不了这里。
  release-apk:
    name: Attach shell APK to GitHub Release
    needs: build-apk
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cute-pet-shell-apk
          path: .

      - name: 产物校验(上 Release 前复查, 与 build-apk 同级防线)
        # 复查的是**即将上传的那个 artifact**(而不是构建目录), 与 build-apk 用同一脚本。
        run: bash pet/webview/android/verify_apk.sh cute-pet-shell.apk

      - name: 等待 Build All 创建 Release 后挂载 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION=$(grep -m1 '^version' pet/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          TAG="v${VERSION}"
          echo "目标 Release: $TAG"
          found=""
          # Build All 的 release job 要等全部平台构建通过才打 tag, 常规需 20-40 分钟;
          # 轮询上限 60 分钟, 超时即失败(静默跳过会变成"忘了挂 APK"类事故)。
          for i in $(seq 1 120); do
            if gh release view "$TAG" >/dev/null 2>&1; then found=1; break; fi
            echo "[$i/120] Release $TAG 尚未创建, 30s 后重试..."
            sleep 30
          done
          if [ -z "$found" ]; then
            echo "::error::60 分钟内未出现 Release $TAG —— Build All 未打 tag(构建失败或版本号已发布), APK 无法挂载"
            exit 1
          fi
          gh release upload "$TAG" cute-pet-shell.apk --clobber
          echo "✅ cute-pet-shell.apk 已挂载到 $TAG"
