name: Build All Platforms

# 跨 8 平台桌宠构建:
#   Android(arm64/armv7/x86_64) · Windows(x64/arm64) · Linux(x64/arm64)
#   macOS(aarch64/x86_64) · iOS(device+sim) · Web(WASM) · HarmonyOS(aarch64)
#
# 备注:
#   - 所有资产经 rust-embed 编译进二进制(无运行时路径问题, 见 src/main.rs load_asset)
#   - HarmonyOS 走自定义 miniquad-ply ohos backend + vendored 依赖(patch.crates-io)
#   - 鸿蒙产物是可执行 ELF/PIE(.so 打包成 HAR), 见 docs/harmonyos-rust.md

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============ Android ============
  android:
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pet
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
          - abi: x86_64
            target: x86_64-linux-android
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('pet/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android NDK r25 (required by plyx)
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;25.2.9519653" \
            --sdk_root=$ANDROID_HOME
      - name: Set Android build target
        run: |
          sed -i 's|build_targets = \[.*\]|build_targets = ["${{ matrix.target }}"]|' Cargo.toml
      - name: Install plyx
        run: cargo install plyx 2>/dev/null || cargo install plyx --locked
      - name: Build APK
        run: plyx apk --native
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}
          path: |
            target/android-artifacts/release/apk/*.apk
            pet/target/android-artifacts/release/apk/*.apk
          if-no-files-found: warn

  # ============ Windows ============
  windows:
    name: Windows (${{ matrix.target }})
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pet
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('pet/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: pet/target
          key: target-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('pet/Cargo.lock') }}
          restore-keys: |
            target-${{ runner.os }}-${{ matrix.target }}
            target-${{ runner.os }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}
          path: pet/target/${{ matrix.target }}/release/cute-pet.exe
          if-no-files-found: warn

  # ============ Linux ============
  linux:
    name: Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pet
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('pet/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: pet/target
          key: target-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('pet/Cargo.lock') }}
          restore-keys: |
            target-${{ runner.os }}-${{ matrix.target }}
            target-${{ runner.os }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install system deps (host)
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev \
            libwayland-dev libxkbcommon-dev pkg-config libgles2-mesa-dev \
            libasound2-dev
      - name: Install cross-compilation deps (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          # GitHub runner 的 host 源(azure/security) 不提供 arm64 Packages,
          # 限制 host 源只拉 amd64, 另加 ports.ubuntu.com 的 arm64 源
          sudo sed -i 's/^Types: deb/Types: deb\nArchitectures: amd64/' /etc/apt/sources.list.d/ubuntu.sources
          printf 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ noble main universe multiverse restricted\ndeb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ noble-updates main universe multiverse restricted\ndeb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ noble-security main universe multiverse restricted\n' | sudo tee /etc/apt/sources.list.d/arm64-cross.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            libx11-dev:arm64 libxi-dev:arm64 libgl1-mesa-dev:arm64 \
            libwayland-dev:arm64 libxkbcommon-dev:arm64 libgles2-mesa-dev:arm64 \
            libasound2-dev:arm64
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: pet/target/${{ matrix.target }}/release/cute-pet
          if-no-files-found: warn

  # ============ macOS ============
  macos:
    name: macOS (${{ matrix.target }})
    runs-on: macos-latest
    defaults:
      run:
        working-directory: pet
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      # _objc_msgSend_ret 是 macOS 14 (Xcode 15) SDK 新增的 objc 运行时符号,
      # deployment target < 14 时链接器拒绝
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('pet/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: pet/target
          key: target-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('pet/Cargo.lock') }}
          restore-keys: |
            target-${{ runner.os }}-${{ matrix.target }}
            target-${{ runner.os }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: |
            pet/target/${{ matrix.target }}/release/cute-pet
            pet/target/${{ matrix.target }}/release/cute-pet.app
          if-no-files-found: warn

  # ============ iOS ============
  ios:
    name: iOS (${{ matrix.target }})
    runs-on: macos-latest
    defaults:
      run:
        working-directory: pet
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim]
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('pet/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: pet/target
          key: target-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('pet/Cargo.lock') }}
          restore-keys: |
            target-${{ runner.os }}-${{ matrix.target }}
            target-${{ runner.os }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Create .app bundle
        run: |
          mkdir -p build/ios/cute-pet.app/assets
          cp target/${{ matrix.target }}/release/cute-pet build/ios/cute-pet.app/
          cat > build/ios/cute-pet.app/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>cute-pet</string>
            <key>CFBundleIdentifier</key><string>com.cute.pet</string>
            <key>CFBundleName</key><string>cute-pet</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>UIRequiresFullScreen</key><true/><key>UILaunchStoryboardName</key><string></string>
          </dict>
          </plist>
          PLIST
          chmod +x build/ios/cute-pet.app/cute-pet
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.target }}
          path: pet/build/ios/cute-pet.app
          if-no-files-found: warn

  # ============ Web (WASM) ============
  web:
    name: Web (WASM)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pet
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('pet/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}
      - name: Cache cargo target (wasm)
        uses: actions/cache@v4
        with:
          path: pet/target
          key: target-${{ runner.os }}-wasm32-unknown-unknown-${{ hashFiles('pet/Cargo.lock') }}
          restore-keys: |
            target-${{ runner.os }}-wasm32-unknown-unknown
            target-${{ runner.os }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --profile release-wasm
      - name: Collect web assets
        run: |
          mkdir -p build/web
          cp target/wasm32-unknown-unknown/release-wasm/cute-pet.wasm build/web/app.wasm
          cp -r assets build/web/assets 2>/dev/null || true
          gzip -kf build/web/app.wasm 2>/dev/null || true
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: web-wasm
          path: pet/build/web/
          if-no-files-found: warn

  # ============ HarmonyOS (OpenHarmony, 原生) ============
  # 参考 ohos-rs(https://ohos.rs/docs/ci/basic): 用官方 openharmony-rs/setup-ohos-sdk
  # 自动下载装 OHOS SDK(无需登录, 有 cache), 结合 apt 装 clang + RUSTFLAGS 覆盖
  # 本地 config 的死路径。clang 路径固定 /usr/bin(apt装), 避免 chron的路径猜测。
  harmony:
    name: HarmonyOS (${{ matrix.target }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pet
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-unknown-linux-ohos]
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('pet/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: pet/target
          key: target-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('pet/Cargo.lock') }}
          restore-keys: |
            target-${{ runner.os }}-${{ matrix.target }}
            target-${{ runner.os }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup OpenHarmony SDK
        id: ohos
        uses: openharmony-rs/setup-ohos-sdk@v1.0.1
        with:
          version: "6.1"

      - name: Install clang/LLVM (system, fixed path)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm-dev lld

      - name: Init OHOS CRT (crtbegin/end/unwind -> sysroot)
        run: |
          NATIVE="${{ steps.ohos.outputs.ohos_sdk_native }}"
          SYSROOT="$NATIVE/sysroot"
          DEST="$SYSROOT/usr/lib/aarch64-linux-ohos"
          RTLIB=$(dirname "$(find "$NATIVE" -name clang_rt.crtbegin.o -path "*aarch64*" | head -1)")
          # 幂等: SDK 新版本可能自带部分 CRT 文件, 已存在则跳过
          [ -f "$DEST/crtbeginS.o" ] || cp "$RTLIB/clang_rt.crtbegin.o" "$DEST/crtbeginS.o"
          [ -f "$DEST/crtendS.o" ]   || cp "$RTLIB/clang_rt.crtend.o"   "$DEST/crtendS.o"
          [ -f "$DEST/libunwind.a" ] || cp "$(find "$NATIVE" -name libunwind.a -path "*aarch64*" | head -1)" "$DEST/libunwind.a"
          # 保存路径给下一步
          echo "OHOS_SYSROOT=$SYSROOT" >> "$GITHUB_ENV"
          echo "OHOS_LIBDIR=$DEST" >> "$GITHUB_ENV"

      - name: Set ohos cross env (RUSTFLAGS + CC)
        run: |
          {
            echo "CC_aarch64_unknown_linux_ohos=/usr/bin/clang"
            echo "AR_aarch64_unknown_linux_ohos=/usr/bin/llvm-ar"
            echo "CFLAGS_aarch64_unknown_linux_ohos=--target=aarch64-linux-ohos --sysroot=$OHOS_SYSROOT"
            echo "RUSTFLAGS=-C link-arg=--target=aarch64-linux-ohos -C link-arg=--sysroot=$OHOS_SYSROOT -C link-arg=-L -C link-arg=$OHOS_LIBDIR"
          } >> "$GITHUB_ENV"

      - name: Build (native ELF)
        run: cargo build --target ${{ matrix.target }} --release

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: harmony-${{ matrix.target }}
          path: pet/target/${{ matrix.target }}/release/cute-pet
          if-no-files-found: warn

  # ============ 发布: 全部构建成功后自动打 tag + GitHub Release ============
  release:
    name: Publish GitHub Release
    needs: [android, windows, linux, macos, ios, web, harmony]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create tag & release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION=$(grep -m1 '^version' pet/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists, skipping"
            exit 0
          fi
          # 每个 artifact 目录打包成 zip(避免同名文件冲突, 平台隔离)
          mkdir -p release_assets
          for d in dist/*/; do
            [ -d "$d" ] || continue
            name=$(basename "$d")
            (cd "$d" && zip -qr "$GITHUB_WORKSPACE/release_assets/${name}.zip" .) || true
          done
          ls -la release_assets
          {
            echo "## 支持的平台"
            echo "- Android: arm64-v8a / armeabi-v7a / x86_64 (APK)"
            echo "- Windows: x86_64 / arm64"
            echo "- Linux: x86_64 / aarch64"
            echo "- macOS: arm64 / x86_64"
            echo "- iOS: device / simulator (.app)"
            echo "- Web: WASM"
            echo "- HarmonyOS: aarch64 (ELF)"
          } > notes.md
          gh release create "$TAG" release_assets/*.zip \
            --title "cute-pet v${VERSION}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
