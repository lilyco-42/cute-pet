name: Build All Platforms

# 跨 8 平台桌宠构建:
#   Android(arm64/armv7/x86_64) · Windows(x64/arm64) · Linux(x64/arm64)
#   macOS(aarch64/x86_64) · iOS(device+sim) · Web(WASM) · HarmonyOS(aarch64)
#
# 备注:
#   - 所有资产经 rust-embed 编译进二进制(无运行时路径问题, 见 src/main.rs load_asset)
#   - HarmonyOS 走自定义 miniquad-ply ohos backend + vendored 依赖(patch.crates-io)
#   - 鸿蒙产物是可执行 ELF/PIE(.so 打包成 HAR), 见 docs/harmonyos-rust.md

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============ Lint & test(最便宜的门禁, 放最前面) ============
  # 意图: 8 个平台各跑一次全量构建要 ~20 分钟, 而绝大多数回归是不分平台的
  # (依赖漂移、逻辑 bug、CI 脚本写错)。先花 1 分钟在单一平台上把 "能验证的事"
  # 验证掉, 挂了就不必烧后面的机器时间。
  #
  # 阻塞项与非阻塞项的区别见各 step 注释 —— 本仓库从未整体 rustfmt 过,
  # 一次性格式化会产出铺满全仓的 diff, 因此 fmt/clippy 先以 advisory 运行,
  # 等归零后再去掉 continue-on-error 收紧为阻塞。
  lint:
    name: Lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pet
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-lint-${{ hashFiles('pet/Cargo.lock') }}
          restore-keys: |
            cargo-lint
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: pet/target
          key: target-${{ runner.os }}-lint-${{ hashFiles('pet/Cargo.lock') }}
          restore-keys: |
            target-${{ runner.os }}-lint
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # 主 crate 链接 miniquad(gl/wayland/x11/alsa), 缺 -dev 时 cargo test 会在
      # 编译 native 依赖阶段就失败, 和 linux job 用的是同一套
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev \
            libwayland-dev libxkbcommon-dev pkg-config libgles2-mesa-dev \
            libasound2-dev

      # ── 阻塞项 ──
      # 只跑 --lib --bins: 不构建 example/doc-test(那属于 "能不能编译",
      # 由后面的平台 job 兜底), 这里管的是 "逻辑还对不对"。
      # 注意: pet/host 是独立 crate(#![cfg(target_env = "ohos")], 在非鸿蒙下内容
      # 全部 cfg 掉), 不在本 job 覆盖范围内, 由 harmony job 的真实交叉编译兜底。
      - name: cargo test
        run: cargo test --lib --bins

      # 素材解耦闸门: 两种配置都要测, 否则另一条路径上的编译 / 逻辑错误会悄悄溜过去。
      #   默认(上一步)                  = 商业构建, 二进制不含第三方版权角色素材
      #   --features bundle-murasame    = 测试 / 开发构建, 素材编入, 体验完整
      # 角色素材版权归柚子社《千恋＊万花》, 不归我方 —— 详见 THIRD-PARTY-NOTICES.md §2.2。
      - name: cargo test (dev build, character assets bundled)
        run: cargo test --lib --bins --features bundle-murasame

      # ── 非阻塞项(advisory) ──
      - name: cargo fmt --check
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: cargo clippy
        continue-on-error: true
        run: cargo clippy --lib --bins

  # ============ Android ============
  android:
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pet
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
          - abi: x86_64
            target: x86_64-linux-android
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('pet/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 2026-09-15 起 Google 把废弃的 `tools` 包从仓库索引里移除, 而本 action
          # 的默认 packages 仍是 "tools platform-tools", sdkmanager 找不到 tools
          # 就直接 exit 1 —— 编译还没开始 job 就红了。显式给 packages 绕开默认值。
          # 上游: android-actions/setup-android#537
          packages: platform-tools
      - name: Install Android NDK r25 (required by plyx)
        run: |
          # 新版 runner 镜像的 cmdline-tools 目录直接用版本号命名(如 16.0), 不再有
          # latest 这一份, 硬编码 cmdline-tools/latest 会 No such file。取实际那份。
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses --sdk_root="$ANDROID_HOME" >/dev/null 2>&1 || true
          # Cargo.toml 里 android_version/target_sdk_version = 36, 故一并装 platform 与
          # build-tools(aapt2 在 build-tools 里), 不再依赖镜像预装的版本。
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;25.2.9519653"
      - name: Set Android build target
        run: |
          sed -i 's|build_targets = \[.*\]|build_targets = ["${{ matrix.target }}"]|' Cargo.toml
      - name: Install fork cargo-quad-apk + plyx (matches local toolchain)
        run: |
          # 本地成功组合 = plyx + fork cargo-quad-apk(PATH)。crates.io cargo-quad-apk
          # 不支持 [[package.metadata.android.service]](ScreenCaptureService 无法生成)。
          # 装 fork(供 plyx 调用) + plyx, 与本地一致。
          cargo install --git https://github.com/TheRedDeveloper/cargo-quad-apk-ply || cargo install --git https://github.com/TheRedDeveloper/cargo-quad-apk-ply --locked
          cargo install plyx 2>/dev/null || cargo install plyx --locked
      - name: Build APK (plyx + fork cargo-quad-apk)
        run: |
          export NDK_HOME="${ANDROID_HOME}/ndk/25.2.9519653"
          plyx apk --native
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}
          path: |
            target/android-artifacts/release/apk/*.apk
            pet/target/android-artifacts/release/apk/*.apk
          if-no-files-found: warn

  # ============ Windows ============
  windows:
    name: Windows (${{ matrix.target }})
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pet
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('pet/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: pet/target
          key: target-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('pet/Cargo.lock') }}
          restore-keys: |
            target-${{ runner.os }}-${{ matrix.target }}
            target-${{ runner.os }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}
          path: pet/target/${{ matrix.target }}/release/cute-pet.exe
          if-no-files-found: warn

  # ============ Linux ============
  linux:
    name: Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pet
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('pet/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: pet/target
          key: target-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('pet/Cargo.lock') }}
          restore-keys: |
            target-${{ runner.os }}-${{ matrix.target }}
            target-${{ runner.os }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install system deps (host)
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev \
            libwayland-dev libxkbcommon-dev pkg-config libgles2-mesa-dev \
            libasound2-dev
      - name: Install cross-compilation deps (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          # GitHub runner 的 host 源(azure/security) 不提供 arm64 Packages,
          # 限制 host 源只拉 amd64, 另加 ports.ubuntu.com 的 arm64 源
          sudo sed -i 's/^Types: deb/Types: deb\nArchitectures: amd64/' /etc/apt/sources.list.d/ubuntu.sources
          printf 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ noble main universe multiverse restricted\ndeb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ noble-updates main universe multiverse restricted\ndeb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ noble-security main universe multiverse restricted\n' | sudo tee /etc/apt/sources.list.d/arm64-cross.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            libx11-dev:arm64 libxi-dev:arm64 libgl1-mesa-dev:arm64 \
            libwayland-dev:arm64 libxkbcommon-dev:arm64 libgles2-mesa-dev:arm64 \
            libasound2-dev:arm64
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: pet/target/${{ matrix.target }}/release/cute-pet
          if-no-files-found: warn

  # ============ macOS ============
  macos:
    name: macOS (${{ matrix.target }})
    runs-on: macos-latest
    defaults:
      run:
        working-directory: pet
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      # _objc_msgSend_ret 是 macOS 14 (Xcode 15) SDK 新增的 objc 运行时符号,
      # deployment target < 14 时链接器拒绝
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('pet/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: pet/target
          key: target-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('pet/Cargo.lock') }}
          restore-keys: |
            target-${{ runner.os }}-${{ matrix.target }}
            target-${{ runner.os }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: |
            pet/target/${{ matrix.target }}/release/cute-pet
            pet/target/${{ matrix.target }}/release/cute-pet.app
          if-no-files-found: warn

  # ============ iOS ============
  ios:
    name: iOS (${{ matrix.target }})
    runs-on: macos-latest
    defaults:
      run:
        working-directory: pet
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim]
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('pet/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: pet/target
          key: target-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('pet/Cargo.lock') }}
          restore-keys: |
            target-${{ runner.os }}-${{ matrix.target }}
            target-${{ runner.os }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Create .app bundle
        run: |
          mkdir -p build/ios/cute-pet.app/assets
          cp target/${{ matrix.target }}/release/cute-pet build/ios/cute-pet.app/
          cat > build/ios/cute-pet.app/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>cute-pet</string>
            <key>CFBundleIdentifier</key><string>com.cute.pet</string>
            <key>CFBundleName</key><string>cute-pet</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>UIRequiresFullScreen</key><true/><key>UILaunchStoryboardName</key><string></string>
          </dict>
          </plist>
          PLIST
          chmod +x build/ios/cute-pet.app/cute-pet
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.target }}
          path: pet/build/ios/cute-pet.app
          if-no-files-found: warn

  # ============ Web (WASM) ============
  web:
    name: Web (WASM)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pet
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('pet/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}
      - name: Cache cargo target (wasm)
        uses: actions/cache@v4
        with:
          path: pet/target
          key: target-${{ runner.os }}-wasm32-unknown-unknown-${{ hashFiles('pet/Cargo.lock') }}
          restore-keys: |
            target-${{ runner.os }}-wasm32-unknown-unknown
            target-${{ runner.os }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --profile release-wasm
      - name: Collect web assets
        run: |
          mkdir -p build/web build/web/assets
          cp target/wasm32-unknown-unknown/release-wasm/cute-pet.wasm build/web/app.wasm
          # 复制 assets 时**必须排除 murasame***: 角色素材版权归柚子社《千恋＊万花》,
          # 不随商业产物分发。wasm 里已经没有素材了, 但直接 `cp -r assets` 会把
          # 117 张立绘原样打进 zip(v0.3.0 就是这么漏的) —— 别再改回 cp -r。
          tar -cf - -C assets --exclude='murasame*' . | tar -xf - -C build/web/assets
          gzip -kf build/web/app.wasm 2>/dev/null || true
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: web-wasm
          path: pet/build/web/
          if-no-files-found: warn

  # ============ HarmonyOS (OpenHarmony, 原生) ============
  # 参考 ohos-rs(https://ohos.rs/docs/ci/basic): 用官方 openharmony-rs/setup-ohos-sdk
  # 自动下载装 OHOS SDK(无需登录, 有 cache), 结合 apt 装 clang + RUSTFLAGS 覆盖
  # 本地 config 的死路径。clang 路径固定 /usr/bin(apt装), 避免 chron的路径猜测。
  harmony:
    name: HarmonyOS (${{ matrix.target }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pet
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-unknown-linux-ohos]
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('pet/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: pet/target
          key: target-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('pet/Cargo.lock') }}
          restore-keys: |
            target-${{ runner.os }}-${{ matrix.target }}
            target-${{ runner.os }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup OpenHarmony SDK
        id: ohos
        uses: openharmony-rs/setup-ohos-sdk@v1.0.1
        with:
          version: "6.1"

      - name: Install clang/LLVM (system, fixed path)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm-dev lld

      - name: Init OHOS CRT (crtbegin/end/unwind -> sysroot)
        run: |
          NATIVE="${{ steps.ohos.outputs.ohos_sdk_native }}"
          SYSROOT="$NATIVE/sysroot"
          DEST="$SYSROOT/usr/lib/aarch64-linux-ohos"
          RTLIB=$(dirname "$(find "$NATIVE" -name clang_rt.crtbegin.o -path "*aarch64*" | head -1)")
          # 幂等: SDK 新版本可能自带部分 CRT 文件, 已存在则跳过
          [ -f "$DEST/crtbeginS.o" ] || cp "$RTLIB/clang_rt.crtbegin.o" "$DEST/crtbeginS.o"
          [ -f "$DEST/crtendS.o" ]   || cp "$RTLIB/clang_rt.crtend.o"   "$DEST/crtendS.o"
          [ -f "$DEST/libunwind.a" ] || cp "$(find "$NATIVE" -name libunwind.a -path "*aarch64*" | head -1)" "$DEST/libunwind.a"
          # 保存路径给下一步
          echo "OHOS_SYSROOT=$SYSROOT" >> "$GITHUB_ENV"
          echo "OHOS_LIBDIR=$DEST" >> "$GITHUB_ENV"

      - name: Set ohos cross env (RUSTFLAGS + CC)
        # CARGO_TARGET_<TARGET>_LINKER 必须显式给: 以前是靠 pet/.cargo/config.toml
        # 里的 [target.aarch64-unknown-linux-ohos] linker = "clang" 兜住的 —— 那段
        # 配置连同里面写死的 D:/ohos-sdk 一起删掉后, linker 回落成 gcc 默认的 `cc`,
        # 而 RUSTFLAGS 里的 --target=... 只有 clang 认, 于是所有 C 链接环节挂
        # "cc: error: unrecognized command-line option '--target=aarch64-linux-ohos'"。
        # 教训: 删本地配置里的死路径时, 顺手检查 CI 是不是其实在靠它续命。
        # 同理 CC_/AR_/CFLAGS_ 给的是 `cc` crate(build script), 不管 rustc 的链接器。
        run: |
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_LINKER=/usr/bin/clang"
            echo "CC_aarch64_unknown_linux_ohos=/usr/bin/clang"
            echo "AR_aarch64_unknown_linux_ohos=/usr/bin/llvm-ar"
            echo "CFLAGS_aarch64_unknown_linux_ohos=--target=aarch64-linux-ohos --sysroot=$OHOS_SYSROOT"
            echo "RUSTFLAGS=-C link-arg=--target=aarch64-linux-ohos -C link-arg=--sysroot=$OHOS_SYSROOT -C link-arg=-L -C link-arg=$OHOS_LIBDIR"
          } >> "$GITHUB_ENV"

      - name: Build (native ELF)
        run: cargo build --target ${{ matrix.target }} --release

      # pet/host 是鸿蒙 staticlib(NAPI 壳链接它)。此前它完全不在 CI 里 ——
      # 所以 `demo = { path = "../../lazy-ply" }` 指向本机 junction 这件事
      # 断了很久也没被发现。加进来, 以后改 lib 不会再静默搞坏鸿蒙线。
      - name: Build HarmonyOS host staticlib (pet/host)
        working-directory: pet/host
        run: cargo build --target ${{ matrix.target }} --release

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: harmony-${{ matrix.target }}
          path: pet/target/${{ matrix.target }}/release/cute-pet
          if-no-files-found: warn

      - name: Upload host staticlib
        uses: actions/upload-artifact@v4
        with:
          name: harmony-host-${{ matrix.target }}
          path: pet/host/target/${{ matrix.target }}/release/libcute_pet_host.a
          if-no-files-found: error

  # ============ 发布: 全部构建成功后自动打 tag + GitHub Release ============
  release:
    name: Publish GitHub Release
    needs: [lint, android, windows, linux, macos, ios, web, harmony]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      # 发布前最后一道闸门: 任何产物里出现角色素材就**拒绝发布**。
      # v0.3.0 就是靠这一步本该拦住的漏洞漏出去的(web job 用 cp -r assets 把
      # 117 张立绘原样打进了 zip)。放在这里可以覆盖所有平台, 不只是 web。
      - name: Verify no third-party character assets
        run: |
          hits=$(find dist -iname '*murasame*' | head -20)
          if [ -n "$hits" ]; then
            echo "::error::产物含第三方版权角色素材(柚子社《千恋＊万花》), 禁止发布"
            echo "$hits"
            exit 1
          fi
          echo "OK: 所有产物均不含角色素材"
      - name: Create tag & release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION=$(grep -m1 '^version' pet/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists, skipping"
            exit 0
          fi
          # 每个 artifact 目录打包成 zip(避免同名文件冲突, 平台隔离)
          mkdir -p release_assets
          for d in dist/*/; do
            [ -d "$d" ] || continue
            name=$(basename "$d")
            (cd "$d" && zip -qr "$GITHUB_WORKSPACE/release_assets/${name}.zip" .) || true
          done
          ls -la release_assets
          {
            echo "## 版权与素材声明"
            echo "- **本版本为商业构建, 不含任何第三方版权角色素材与音频。**"
            echo "- 软件本体(屏幕操控 / 对话系统 / 角色渲染引擎)为原创, MIT 许可, 可商用;"
            echo "  角色素材与音频版权归原权利人所有, 不随本发行物分发。"
            echo "- 如需角色: 请自行以合法持有方式提供素材, 放到程序同级的 assets/ 目录(运行时加载)。"
            echo "- 字体: 霞鹜文楷 LXGW WenKai, SIL Open Font License 1.1, 许可证文本随附。"
            echo "- 完整合规清单见仓库 THIRD-PARTY-NOTICES.md。"
            echo ""
            echo "## 支持的平台"
            echo "- Android: arm64-v8a / armeabi-v7a / x86_64 (APK)"
            echo "- Windows: x86_64 / arm64"
            echo "- Linux: x86_64 / aarch64"
            echo "- macOS: arm64 / x86_64"
            echo "- iOS: device / simulator (.app)"
            echo "- Web: WASM"
            echo "- HarmonyOS: aarch64 (ELF)"
          } > notes.md
          gh release create "$TAG" release_assets/*.zip \
            --title "cute-pet v${VERSION}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
